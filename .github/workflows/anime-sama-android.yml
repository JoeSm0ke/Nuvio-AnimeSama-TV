name: Anime-Sama TV - APK de test

on:
  push:
    branches:
      - anime-sama-tv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Configure debug signing
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug-ci.jks" -storepass android \
            -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/debug-ci.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew :app:assembleFullDebug --stacktrace --no-daemon
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Sama-TV-Qilive-ARM-Debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
